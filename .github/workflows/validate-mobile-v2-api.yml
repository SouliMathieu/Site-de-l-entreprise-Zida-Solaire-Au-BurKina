name: Validate Mobile V2 API

on:
  push:
    branches: [mobile-v2-api]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/zida_ci
          NEXTAUTH_SECRET: ci-only-secret-not-used-at-runtime
